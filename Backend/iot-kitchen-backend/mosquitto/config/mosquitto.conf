# =====================================================================
#  MOSQUITTO - Cấu hình Broker cho đồ án "Giám sát & thông gió phòng bếp"
#  Tài liệu: https://mosquitto.org/man/mosquitto-conf-5.html
# =====================================================================

# ---------- Cổng 1883: MQTT cho ESP32 và Backend ----------
listener 1883
protocol mqtt

# ---------- Cổng 9001: MQTT over WebSockets cho Web Dashboard ----------
# Trình duyệt không mở được socket TCP thuần nên Dashboard (TV4) phải dùng WebSocket.
# Bản thống nhất mục 8: MQTT 1883, WebSocket 9001.
listener 9001
protocol websockets

# ---------- Xác thực ----------
# Từ Mosquitto 2.0, mặc định allow_anonymous = false và chỉ lắng nghe 127.0.0.1
# nếu không khai báo listener. Ở đây ta khai báo tường minh cho dễ đọc khi báo cáo.
allow_anonymous false

# Hai file dưới đây KHÔNG nằm trong ./mosquitto/config mà được sinh ra lúc container khởi động
# (xem phần command của service mosquitto trong docker-compose.yml). Lý do:
#   1. Mật khẩu chỉ nằm trong .env, không commit lên Git.
#   2. File mount từ Windows luôn có quyền 0777 và chủ sở hữu lạ -> Mosquitto cảnh báo
#      "unsafe permissions"; file sinh trong container thuộc user mosquitto với quyền 0600.
password_file /mosquitto/runtime/passwd
acl_file /mosquitto/runtime/acl

# Ghi chú cho báo cáo: từ 2.1, hai tuỳ chọn trên được chuyển dần sang dạng plugin
# (sẽ bị bỏ ở 3.0) nhưng vẫn hoạt động bình thường. Cách viết mới tương đương:
#   plugin /usr/lib/mosquitto_password_file.so
#   plugin_opt_password_file /mosquitto/runtime/passwd
#   plugin /usr/lib/mosquitto_acl_file.so
#   plugin_opt_acl_file /mosquitto/runtime/acl
# (chỉ dùng được với image 2.1 trở lên - giữ cách cũ để chạy được cả 2.0 lẫn 2.1).

# ---------- Lưu trữ ----------
# Giữ lại bản tin retain (status, mode/set, config/set) sau khi khởi động lại Broker.
persistence true
persistence_location /mosquitto/data/

# ---------- Nhật ký ----------
# Ghi ra stdout để xem bằng: docker compose logs -f mosquitto
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Bỏ dấu # ở dòng dưới khi cần gỡ lỗi ACL: bản tin "Denied PUBLISH ..." chỉ hiện ở mức debug.
#log_type debug
